<!DOCTYPE html>
<html>
<head>
    <title>管理员身份持久化测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { margin: 5px; padding: 10px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>管理员身份持久化测试</h1>
    
    <div class="test-section">
        <h3>测试步骤：</h3>
        <button onclick="createAdmin()">1. 创建管理员身份</button>
        <button onclick="checkAdmin()">2. 检查管理员身份</button>
        <button onclick="clearSession()">3. 清除SessionStorage</button>
        <button onclick="checkAdminAfterClear()">4. 清除后检查身份</button>
        <button onclick="clearAll()">5. 清除所有数据</button>
    </div>
    
    <div class="test-section">
        <h3>存储状态：</h3>
        <button onclick="showStorage()">显示存储状态</button>
        <pre id="storage-status"></pre>
    </div>
    
    <div class="test-section">
        <h3>测试结果：</h3>
        <div id="test-results"></div>
    </div>

    <script>
        const roomId = 'test-room-123';
        const userId = 'admin-user-456';
        
        function log(message, type = 'info') {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            console.log(message);
        }
        
        // 模拟加密函数
        function simpleEncrypt(data, password) {
            return btoa(JSON.stringify(data) + '::' + password);
        }
        
        function simpleDecrypt(encrypted, password) {
            try {
                const decrypted = atob(encrypted);
                const [dataStr, storedPassword] = decrypted.split('::');
                if (storedPassword === password) {
                    return JSON.parse(dataStr);
                }
                throw new Error('密码不匹配');
            } catch (error) {
                throw new Error('解密失败: ' + error.message);
            }
        }
        
        // 模拟 saveCreatorInfo
        function saveCreatorInfo(roomId, info) {
            const storageKey = `chitchatter_creator_${roomId}`;
            const passwordKey = `chitchatter_room_password_${roomId}`;
            
            // 先尝试从sessionStorage获取密码
            let password = sessionStorage.getItem(passwordKey);
            
            // 如果sessionStorage没有，尝试从localStorage获取
            if (!password) {
                password = localStorage.getItem(passwordKey);
            }
            
            // 如果都没有，生成一个基于roomId的密码
            if (!password) {
                password = `room_${roomId}_${Date.now()}`;
                localStorage.setItem(passwordKey, password);
                log('✅ 生成并保存房间密码', 'success');
            } else {
                // 确保密码也保存到localStorage
                localStorage.setItem(passwordKey, password);
            }
            
            const encrypted = simpleEncrypt(info, password);
            localStorage.setItem(storageKey, encrypted);
            
            // 设置session标记
            sessionStorage.setItem(`chitchatter_session_creator_${roomId}`, 'true');
            log('✅ 管理员信息已加密存储', 'success');
        }
        
        // 模拟 loadCreatorInfo
        function loadCreatorInfo(roomId) {
            const storageKey = `chitchatter_creator_${roomId}`;
            const passwordKey = `chitchatter_room_password_${roomId}`;
            const stored = localStorage.getItem(storageKey);
            
            if (!stored) {
                log('[管理员恢复] 未找到存储数据', 'error');
                return null;
            }
            
            // 先尝试从localStorage获取密码
            let password = localStorage.getItem(passwordKey);
            
            // 如果localStorage没有，尝试从sessionStorage获取
            if (!password) {
                password = sessionStorage.getItem(passwordKey);
                if (password) {
                    // 将密码保存到localStorage以便持久化
                    localStorage.setItem(passwordKey, password);
                }
            }
            
            log(`[管理员恢复] 密码状态: ${password ? '存在' : '不存在'}`, 'info');
            
            if (password) {
                try {
                    const info = simpleDecrypt(stored, password);
                    
                    // 恢复session标记
                    sessionStorage.setItem(`chitchatter_session_creator_${roomId}`, 'true');
                    log('[管理员恢复] 解密成功，已恢复session标记', 'success');
                    return info;
                } catch (error) {
                    log(`[管理员恢复] 解密失败: ${error.message}`, 'error');
                    return null;
                }
            } else {
                log('[管理员恢复] 无密码，无法解密', 'error');
                return null;
            }
        }
        
        // 模拟 isRoomCreator
        function isRoomCreator(roomId, userId) {
            try {
                const creatorInfo = loadCreatorInfo(roomId);
                return creatorInfo?.userId === userId;
            } catch {
                return false;
            }
        }
        
        function createAdmin() {
            const info = {
                roomId,
                userId,
                privateKeyString: 'mock-private-key',
                publicKeyString: 'mock-public-key',
                contentKeyString: 'mock-content-key',
                createdAt: new Date().toISOString()
            };
            
            saveCreatorInfo(roomId, info);
            log('✅ 管理员身份已创建', 'success');
            showStorage();
        }
        
        function checkAdmin() {
            const isAdmin = isRoomCreator(roomId, userId);
            log(`管理员身份检查: ${isAdmin ? '✅ 是管理员' : '❌ 不是管理员'}`, isAdmin ? 'success' : 'error');
            showStorage();
        }
        
        function clearSession() {
            sessionStorage.clear();
            log('🧹 SessionStorage已清除', 'info');
            showStorage();
        }
        
        function checkAdminAfterClear() {
            const isAdmin = isRoomCreator(roomId, userId);
            log(`清除后管理员身份检查: ${isAdmin ? '✅ 是管理员' : '❌ 不是管理员'}`, isAdmin ? 'success' : 'error');
            showStorage();
        }
        
        function clearAll() {
            localStorage.clear();
            sessionStorage.clear();
            log('🧹 所有存储已清除', 'info');
            showStorage();
        }
        
        function showStorage() {
            const status = document.getElementById('storage-status');
            const localKeys = Object.keys(localStorage).filter(k => k.includes('chitchatter'));
            const sessionKeys = Object.keys(sessionStorage).filter(k => k.includes('chitchatter'));
            
            let html = '<strong>LocalStorage:</strong>\n';
            localKeys.forEach(key => {
                const value = localStorage.getItem(key);
                html += `${key}: ${value.length > 50 ? value.substring(0, 50) + '...' : value}\n`;
            });
            
            html += '\n<strong>SessionStorage:</strong>\n';
            sessionKeys.forEach(key => {
                const value = sessionStorage.getItem(key);
                html += `${key}: ${value}\n`;
            });
            
            if (localKeys.length === 0 && sessionKeys.length === 0) {
                html += '(空)';
            }
            
            status.textContent = html;
        }
        
        // 页面加载时显示存储状态
        window.onload = function() {
            showStorage();
            log('页面已加载，请按顺序执行测试步骤', 'info');
        };
    </script>
</body>
</html>
